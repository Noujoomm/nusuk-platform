# Render.com Blueprint — Single Service (NestJS API + Next.js web in one container)
#
# Architecture: start.sh launches the API on the internal API_PORT (4000),
# waits for /health, then execs the Next.js standalone server on the public
# PORT (Render-injected). Next.js proxies /api/*, /uploads/*, /socket.io/*
# to the internal API (see apps/web/next.config.js). The render health check
# hits /api/health which is a native Next.js route (does not depend on the
# API being up), so a transient API restart never marks the service down.
services:
  - type: web
    name: nusuk-platform-evc
    runtime: node
    region: frankfurt
    plan: starter
    repo: https://github.com/Noujoomm/nusuk-platform.git
    branch: main
    autoDeploy: true
    buildCommand: npm install && cd apps/api && npx prisma generate && npm run build && cd ../web && npm run build
    startCommand: bash start.sh
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nusuk-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: API_PORT
        value: "4000"
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: nusuk-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 16
